dependencies:
  espressif/console_simple_init: ^1.1.0
  embr-coap:
    path: ../../../../tools/esp-idf/components/embr-coap
  embr-wifi:
    path: ../../../../lib/esp-idf/embr-wifi
  embr-coap-synthetic:
    path: ../../../../lib/esp-idf/embr-coap-synthetic
  embr-bmgr:
    git: git@github.com:embr-iot/esp-bmgr
    path: lib/embr-bmgr
    version: dev
  embr-bmgr-lvgl:
    git: git@github.com:embr-iot/esp-bmgr
    path: lib/embr-bmgr-lvgl
    matches:
      - if: '$CONFIG{ESP_BOARD_DEV_DISPLAY_LCD_SUPPORT} == True'
    version: dev
