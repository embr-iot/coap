name: ESP-IDF

on:
  push:
    branches: [ "feat/**", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: [v5.4.4, v5.5.5, v6.0.3, v6.1]
        target: [esp32, esp32s3, esp32c3, esp32c6]
        include:
        - target: esp32
          qemu: true
        - target: esp32c3
          qemu: true
        - target: esp32s3
          qemu: true

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: "build"
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ matrix.version }}
        target: ${{ matrix.target }}
        path: 'test/esp-idf/catch'
        command: "idf.py build"

    # Catch2 under QEMU; pytest-embedded stops QEMU once tests report success.
    - name: "qemu"
      timeout-minutes: 3
      if: matrix.qemu
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ matrix.version }}
        target: ${{ matrix.target }}
        path: 'test/esp-idf/catch'
        command: >-
          python -m pip install -r requirements.txt &&
          pytest pytest_catch2.py
          --embedded-services idf,qemu
          --target ${{ matrix.target }}
          --app-path .
          --build-dir build
          --timeout=30
